[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "drjavanbot"
version = "0.6.0"
description = "Evidence-grounded Telegram Q&A over the Dr Mehdi Javan group archive"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]
[project.optional-dependencies]
dev = ["pytest>=9,<10"]
[project.scripts]
drjavanbot = "drjavanbot.cli:main"
drjavanbot-bot = "drjavanbot.telegram.runtime:main"
drjavanbot-smoke = "drjavanbot.smoke:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
drjavanbot = ["data/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

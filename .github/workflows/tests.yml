name: DrJavanBot tests

on:
  push:
    branches: [main, parallel/brain-quality-lab-v2]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src deploy
      - name: Verify SQLite FTS5
        run: |
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect(':memory:')
          con.execute('CREATE VIRTUAL TABLE t USING fts5(x)')
          con.close()
          PY
      - name: Verify env shell compatibility
        shell: bash
        run: |
          set -a
          . ./.env.example
          set +a
          test "$DRJAVAN_ARCHIVE_DIR" = "گروه دکتر جوان"
      - name: Test
        run: pytest -q
      - name: Full archive Quality Lab strict gate
        run: |
          drjavanbot --archive-dir "گروه دکتر جوان" quality-eval \
            --strict \
            --top-k 12 \
            --base-sha 4226f2c30a04d89a28afe8284be5c3e5f657a2a6 \
            --json-out quality-lab-report.json
      - name: Legacy semantic benchmark integration cross-check
        if: github.event_name == 'pull_request' && github.head_ref == 'integration/brain-v2'
        run: |
          drjavanbot --archive-dir "گروه دکتر جوان" semantic-benchmark \
            --strict \
            --top-k 12
      - name: Upload PII-safe Quality Lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-lab-report
          path: quality-lab-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify systemd unit syntax and fixed paths
        shell: bash
        run: |
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin drjavanbot 2>/dev/null || true
          sudo install -d /opt/drjavanbot/current/.venv/bin /opt/drjavanbot/current/deploy /etc/drjavanbot /var/lib/drjavanbot/update /var/cache/drjavanbot
          sudo touch /opt/drjavanbot/current/.venv/bin/drjavanbot-bot
          sudo chmod +x /opt/drjavanbot/current/.venv/bin/drjavanbot-bot
          sudo cp deploy/self_update.py /opt/drjavanbot/current/deploy/self_update.py
          sudo cp .env.example /etc/drjavanbot/drjavanbot.env
          sudo systemd-analyze verify deploy/drjavanbot.service deploy/drjavanbot-updater.service deploy/drjavanbot-updater.path
